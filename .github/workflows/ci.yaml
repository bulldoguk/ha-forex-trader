name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx ruff@0.17.3 check --output-format github .

  tests:
    # The two add-ons share module names (config, state, logger...), so each
    # suite runs in its own process. Python 3.11 matches the add-on base images.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: [forex-trader, forex-pairs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --python 3.11
      - run: uv run --python 3.11 pytest ${{ matrix.addon }}/tests
