name: Build and publish add-on images

on:
  push:
    branches:
      - main
    paths:
      - "forex-trader/**"
      - "forex-pairs/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        addon:
          - forex-trader
          - forex-pairs
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get add-on information
        id: info
        uses: home-assistant/actions/helpers/info@86d4564712fa02543c808e3a693dd04f9d3f8361 # master 2026-10-26
        with:
          path: "./${{ matrix.addon }}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push add-on image
        uses: home-assistant/builder@624299e7dd9fcd763ea8a39b719809ab3674c405 # master 2026-10-26 (deprecated upstream; migration is the separate builder task)
        with:
          args: |
            --amd64 --aarch64 \
            --target /data/${{ matrix.addon }} \
            --generic ${{ steps.info.outputs.version }} \
            --docker-hub ghcr.io/bulldoguk
