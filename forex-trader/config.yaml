name: "Forex Trader"
version: "1.5.4"
slug: "forex_trader"
description: "Automated pivot mean-reversion trading — GBP/USD, EUR/USD, GBP/JPY, USD/JPY, EUR/JPY, USD/CAD"
url: "https://github.com/bulldoguk/ha-forex-trader"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
init: false
ingress: true
ingress_port: 5000
panel_icon: "mdi:chart-candlestick"
panel_title: "Forex Trader"

options:
  oanda_token: ""
  oanda_account_id: ""
  oanda_env: "practice"
  gmail_from: ""
  gmail_app_password: ""
  notify_email: ""
  gbpusd_enabled: true
  eurusd_enabled: true
  gbpjpy_enabled: true
  usdjpy_enabled: true
  eurjpy_enabled: true
  usdcad_enabled: true
  gbpusd_units: 10000
  eurusd_units: 10000
  gbpjpy_units: 10000
  usdjpy_units: 10000
  eurjpy_units: 10000
  usdcad_units: 10000

schema:
  oanda_token: str
  oanda_account_id: str
  oanda_env: "list(practice|live)"
  gmail_from: str
  gmail_app_password: str
  notify_email: str
  gbpusd_enabled: bool
  eurusd_enabled: bool
  gbpjpy_enabled: bool
  usdjpy_enabled: bool
  eurjpy_enabled: bool
  usdcad_enabled: bool
  gbpusd_units: int
  eurusd_units: int
  gbpjpy_units: int
  usdjpy_units: int
  eurjpy_units: int
  usdcad_units: int

map:
  - share:rw
